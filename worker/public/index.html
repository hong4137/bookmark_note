<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="독서 노트">
<title>독서 노트</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">

<style>
/* ────────────────────────────────────────────────────────────
   종이·활자. 읽기 위한 도구라 화면도 읽기 쪽으로 기울인다.
   순백·순흑을 피하고, 테두리보다 여백과 얇은 선으로 나눈다.
   ──────────────────────────────────────────────────────────── */
:root {
  color-scheme: light dark;
  --paper:   #faf6ee;   /* 바탕 — 살짝 누런 종이 */
  --raised:  #fffdf8;   /* 떠 있는 면 */
  --ink:     #24211c;   /* 본문 */
  --ink-2:   #56504608; /* (미사용 자리표시) */
  --faint:   #8b8275;   /* 보조 글자 */
  --rule:    #e6ded0;   /* 구분선 */
  --accent:  #9a5b2b;   /* 강조 — 바랜 주홍 */
  --mark:    #f3e7cd66; /* 하이라이트 바탕 */
  --markrule:#c99a4e;   /* 하이라이트 밑줄 */
  --serif:   'Noto Serif KR', 'Nanum Myeongjo', 'Apple SD Gothic Neo', 'Malgun Gothic', serif;
  --sans:    -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
  --safe-t:  env(safe-area-inset-top, 0px);
  --safe-b:  env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper:  #14130f;
    --raised: #1c1a15;
    --ink:    #e6e0d4;
    --faint:  #8d857a;
    --rule:   #2c2921;
    --accent: #d99a5e;
    --mark:   #3a301b66;
    --markrule:#8a6b34;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* display 를 지정한 클래스가 [hidden] 을 이기므로 못박아 둔다 */
[hidden] { display: none !important; }
html, body { overscroll-behavior-y: none; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── 헤더 ─────────────────────────────────────────────── */
header {
  position: sticky; top: 0; z-index: 20;
  padding: calc(10px + var(--safe-t)) 20px 10px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(14px);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
header.scrolled { border-bottom-color: var(--rule); }
.bar { display: flex; align-items: center; gap: 4px; min-height: 30px; }
.bar .grow { flex: 1; min-width: 0; }

.crumb {
  font-size: .78rem; color: var(--faint); letter-spacing: .02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
h1 {
  font-family: var(--serif); font-weight: 600;
  font-size: 1.5rem; line-height: 1.25; margin: 2px 0 0;
  letter-spacing: -.01em;
}
h1 small { font-family: var(--sans); font-weight: 400; font-size: .8rem; color: var(--faint); margin-left: 7px; }

.icon {
  appearance: none; border: 0; background: none; color: var(--ink);
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  display: grid; place-items: center; font-size: 1.15rem; cursor: pointer;
}
.icon:active { background: var(--rule); }
.txtbtn {
  appearance: none; border: 0; background: none; cursor: pointer;
  color: var(--accent); font: inherit; font-size: .85rem; padding: 6px 4px;
}

/* ── 본문 영역 ─────────────────────────────────────────── */
main {
  max-width: 680px; margin: 0 auto;
  padding: 6px 20px calc(96px + var(--safe-b));
}
.view { animation: slide .22s cubic-bezier(.2,.7,.3,1); }
.view.back { animation-name: slideBack; }
@keyframes slide     { from { opacity: 0; transform: translateX(14px); } }
@keyframes slideBack { from { opacity: 0; transform: translateX(-14px); } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } }

/* ── 목록 (카드 대신 얇은 선) ───────────────────────────── */
.list { margin-top: 4px; }
.item {
  display: flex; align-items: baseline; gap: 12px;
  padding: 15px 2px; border-bottom: 1px solid var(--rule); cursor: pointer;
}
.item:active { background: var(--raised); }
.item .t { font-family: var(--serif); font-size: 1.06rem; flex: 1; min-width: 0; }
.item .t .sub {
  display: block; font-family: var(--sans); font-size: .82rem;
  color: var(--faint); margin-top: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.item .n { font-size: .8rem; color: var(--faint); flex: none; font-variant-numeric: tabular-nums; }
.item .chev { color: var(--rule); flex: none; font-size: .9rem; }

.tag {
  display: inline-block; font-size: .7rem; padding: 1px 6px; border-radius: 4px;
  background: var(--mark); color: var(--accent); margin-left: 6px;
  border: 1px solid var(--markrule); vertical-align: 2px;
}

/* ── 문장 ─────────────────────────────────────────────── */
.hint {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: .8rem; color: var(--faint);
  padding: 10px 0 14px; border-bottom: 1px solid var(--rule); margin-bottom: 6px;
}
.s { position: relative; padding: 14px 34px 14px 2px; border-bottom: 1px solid var(--rule); }
.s .body {
  font-family: var(--serif); font-size: 1.08rem; line-height: 1.85;
  cursor: pointer; word-break: keep-all; transition: color .15s;
}
.s.on { background: var(--mark); box-shadow: inset 3px 0 0 var(--markrule); }
.s.on .body {
  text-decoration: underline; text-decoration-color: var(--markrule);
  text-underline-offset: 6px; text-decoration-thickness: 1.5px;
}
.s .tail { color: var(--faint); }
.s .pen {
  position: absolute; top: 12px; right: 0;
  opacity: 0; transition: opacity .15s;
  appearance: none; border: 0; background: none; cursor: pointer;
  color: var(--faint); font-size: .95rem; padding: 4px 6px;
}
.s:hover .pen, .s.on .pen { opacity: 1; }
@media (hover: none) { .s .pen { opacity: .45; } }

/* ── 노트 ─────────────────────────────────────────────── */
.group-h {
  font-family: var(--serif); font-size: .92rem; color: var(--faint);
  padding: 20px 0 8px; position: sticky; top: calc(58px + var(--safe-t));
  background: var(--paper); z-index: 5;
}
.quote { padding: 14px 0 16px; border-bottom: 1px solid var(--rule); }
.quote .q {
  font-family: var(--serif); font-size: 1.06rem; line-height: 1.85;
  word-break: keep-all;
  border-left: 2px solid var(--markrule); padding-left: 14px;
}
.quote .src {
  display: flex; align-items: center; gap: 4px;
  font-size: .78rem; color: var(--faint); margin-top: 10px; padding-left: 16px;
}
.quote .src .grow { flex: 1; }

/* ── 필터 칩 ──────────────────────────────────────────── */
.chips { display: flex; gap: 7px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  appearance: none; cursor: pointer; white-space: nowrap;
  font: inherit; font-size: .82rem; padding: 6px 13px; border-radius: 999px;
  border: 1px solid var(--rule); background: none; color: var(--faint);
}
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }

/* ── 빈 화면 ──────────────────────────────────────────── */
.empty {
  text-align: center; color: var(--faint); padding: 72px 24px;
  font-family: var(--serif); line-height: 1.9; white-space: pre-line;
}
.skel { padding: 15px 2px; border-bottom: 1px solid var(--rule); }
.skel i {
  display: block; height: 13px; border-radius: 4px; background: var(--rule);
  animation: pulse 1.3s ease-in-out infinite;
}
.skel i + i { margin-top: 9px; width: 55%; }
@keyframes pulse { 50% { opacity: .45; } }

/* ── 하단 탭 ──────────────────────────────────────────── */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: center; gap: 4px;
  padding: 6px 12px calc(6px + var(--safe-b));
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(1.6) blur(14px);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  border-top: 1px solid var(--rule);
}
nav button {
  appearance: none; border: 0; background: none; cursor: pointer;
  flex: 1; max-width: 200px; padding: 9px 0 7px; border-radius: 12px;
  color: var(--faint); font: inherit; font-size: .72rem; line-height: 1.3;
}
nav button .ic { display: block; font-size: 1.05rem; margin-bottom: 2px; }
nav button.on { color: var(--accent); }

/* ── 시트(수정·사진) ──────────────────────────────────── */
dialog {
  border: 0; padding: 0; background: none; width: 100%; max-width: none;
  margin: 0; margin-top: auto; max-height: 100dvh;
}
dialog::backdrop { background: rgba(20,17,12,.5); backdrop-filter: blur(2px); }
.sheet {
  background: var(--raised); color: var(--ink);
  border-radius: 20px 20px 0 0; padding: 18px 20px calc(18px + var(--safe-b));
  max-width: 680px; margin: 0 auto;
  animation: up .25s cubic-bezier(.2,.8,.3,1);
}
@keyframes up { from { transform: translateY(26px); opacity: .5; } }
.sheet h2 { font-size: .82rem; color: var(--faint); font-weight: 400; margin: 0 0 12px; }
.sheet textarea {
  width: 100%; min-height: 128px; resize: vertical;
  font-family: var(--serif); font-size: 1.04rem; line-height: 1.8;
  color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 12px; padding: 13px;
}
.sheet img { width: 100%; max-height: 66dvh; object-fit: contain; border-radius: 12px; background: var(--paper); }
.acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.acts button {
  appearance: none; cursor: pointer; font: inherit; font-size: .9rem;
  padding: 10px 18px; border-radius: 11px; border: 1px solid var(--rule);
  background: none; color: var(--ink);
}
.acts button.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }

/* ── 토스트 ───────────────────────────────────────────── */
#toast {
  position: fixed; left: 50%; translate: -50% 0; z-index: 60;
  bottom: calc(86px + var(--safe-b));
  background: var(--ink); color: var(--paper);
  padding: 9px 17px; border-radius: 999px; font-size: .84rem;
  opacity: 0; transition: opacity .2s, translate .2s; pointer-events: none;
}
#toast.show { opacity: .96; translate: -50% -6px; }
</style>
</head>
<body>

<header id="hd">
  <div class="bar">
    <button class="icon" id="back" hidden aria-label="뒤로">‹</button>
    <div class="grow">
      <div class="crumb" id="crumb" hidden></div>
      <h1 id="title">독서 노트</h1>
    </div>
    <button class="txtbtn" id="photo" hidden>원본</button>
  </div>
</header>

<main id="main"></main>

<nav>
  <button id="tabBooks" class="on"><span class="ic">❋</span>책</button>
  <button id="tabNotes"><span class="ic">❞</span>노트</button>
</nav>

<dialog id="editBox">
  <form method="dialog" class="sheet">
    <h2>문장 고치기</h2>
    <textarea id="editText"></textarea>
    <div class="acts">
      <button value="cancel">취소</button>
      <!-- form method=dialog 로 닫으면 close 이벤트가 안 오는 브라우저가 있어
           저장은 submit 이 아니라 버튼 클릭에서 직접 처리한다 -->
      <button type="button" class="primary" id="editSave">저장</button>
    </div>
  </form>
</dialog>

<dialog id="photoBox">
  <form method="dialog" class="sheet">
    <h2 id="photoCap">원본</h2>
    <img id="photoImg" alt="페이지 원본 사진">
    <div class="acts"><button value="close">닫기</button></div>
  </form>
</dialog>

<div id="toast"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
