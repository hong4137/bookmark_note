<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffbf0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="밑줄">
<title>밑줄</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" rel="stylesheet">

<style>
/* ────────────────────────────────────────────────────────────
   형광펜 책상.
   파스텔 색면이 번진 바탕 + 모눈 노트 격자 위에, 검은 테두리와
   각진 그림자를 가진 카드가 툭 놓인다. 강조는 배경색이 아니라
   글자 아래에 그은 형광펜 자국이다.

   한글은 화면에서 명조보다 고딕이 읽기 편하다(네이버 모바일 본문 연구).
   본문까지 전부 고딕(Pretendard)으로 가고, 손글씨체는 숫자·단위에만 쓴다.
   ──────────────────────────────────────────────────────────── */
:root {
  color-scheme: light dark;
  --ink:     #241f1a;   /* 테두리·글자 — 이 색이 이 디자인의 중심이다 */
  --paper:   #fffbf0;
  --card:    #ffffff;
  --faint:   #8a8073;
  --line:    #ece5d6;
  --accent:  #e2703a;
  --mint:    #a8e6cf;
  --marker:  #ffe45e;
  --grid:    #e6ddc8;
  --blob-1:  #ffe08a;
  --blob-2:  #a8e6cf;
  --blob-3:  #ffc4c4;
  --shadow:  var(--ink);
  --safe-t:  env(safe-area-inset-top, 0px);
  --safe-b:  env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink:    #f0e7d6;
    --paper:  #1b1916;
    --card:   #262320;
    --faint:  #9c9283;
    --line:   #34302a;
    --accent: #ff9260;
    --mint:   #3d6b5b;
    --marker: #8a7520;
    --grid:   #2a2722;
    --blob-1: #4a3d1c;
    --blob-2: #24463b;
    --blob-3: #4a2b2b;
    --shadow: #000;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { overscroll-behavior-y: none; }

body {
  margin: 0; color: var(--ink);
  font-family: Pretendard, -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
  font-size: 16px; line-height: 1.6; font-weight: 500;
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(58% 26% at 92% 2%,  var(--blob-1) 0%, transparent 60%),
    radial-gradient(50% 24% at 2% 18%,  var(--blob-2) 0%, transparent 62%),
    radial-gradient(56% 28% at 98% 62%, var(--blob-3) 0%, transparent 62%),
    var(--paper);
  background-attachment: fixed;
}
/* 모눈 노트 격자 */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .5;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
}
header, main, nav, #toast { position: relative; z-index: 1; }

/* ── 헤더 ─────────────────────────────────────────────── */
header { padding: calc(14px + var(--safe-t)) 18px 8px; }
.bar { display: flex; align-items: flex-start; gap: 8px; }
.bar .grow { flex: 1; min-width: 0; }

.crumb {
  display: inline-block; background: var(--ink); color: var(--paper);
  font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
  transform: rotate(-1.6deg); max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
h1 {
  font-size: 34px; font-weight: 800; letter-spacing: -.03em;
  line-height: 1.1; margin: 10px 0 0;
}
h1 small {
  font-family: Gaegu, Pretendard, cursive; font-size: 20px; font-weight: 700;
  color: var(--accent); margin-left: 7px; letter-spacing: 0;
}

.icon {
  appearance: none; background: var(--card); color: var(--ink);
  border: 2px solid var(--ink); border-radius: 12px; cursor: pointer;
  width: 38px; height: 38px; flex: none; display: grid; place-items: center;
  font-size: 1.1rem; box-shadow: 3px 3px 0 var(--shadow); margin-top: 2px;
}
.icon:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--shadow); }
.txtbtn {
  appearance: none; border: 0; background: none; cursor: pointer;
  color: var(--accent); font: inherit; font-size: 13px; font-weight: 700; padding: 5px 2px;
}

/* ── 본문 ─────────────────────────────────────────────── */
main {
  max-width: 660px; margin: 0 auto;
  padding: 10px 14px calc(104px + var(--safe-b));
}
.view { animation: pop .24s cubic-bezier(.2,.8,.3,1); }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.99); } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } }

/* ── 카드 ─────────────────────────────────────────────── */
.card {
  background: var(--card); border: 2px solid var(--ink); border-radius: 18px;
  box-shadow: 5px 6px 0 var(--shadow); padding: 16px 16px 15px; margin-bottom: 14px;
  cursor: pointer;
}
.card:nth-child(odd)  { transform: rotate(-.45deg); }
.card:nth-child(even) { transform: rotate(.5deg); }
.card:active { transform: translate(3px, 3px); box-shadow: 2px 3px 0 var(--shadow); }
.card .h { display: flex; align-items: center; gap: 8px; }
.card .h b { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
.card .h .sp { flex: 1; }
.card .sub {
  font-size: 13px; color: var(--faint); font-weight: 600; margin-top: 7px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.count { font-family: Gaegu, cursive; font-size: 17px; color: var(--accent); }

/* ── 표지 ─────────────────────────────────────────────── */
.card.with-cover { display: flex; gap: 14px; align-items: flex-start; }
.card .cbody { flex: 1; min-width: 0; }
.card .byline {
  font-size: 12.5px; font-weight: 600; color: var(--faint); margin-top: 5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.cover {
  flex: none; width: 54px; aspect-ratio: 2 / 3; border-radius: 6px;
  border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--shadow);
  overflow: hidden; background: var(--paper);
  display: grid; place-items: center;
}
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover.noimg {
  font-size: 22px; font-weight: 800; color: var(--faint);
  background: var(--marker);
}

.pill {
  font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px;
  border: 1.5px solid var(--ink); background: var(--mint); color: var(--ink);
}
.pill.y { background: var(--marker); }

/* ── 문장 ─────────────────────────────────────────────── */
.sheet-card {
  background: var(--card); border: 2px solid var(--ink); border-radius: 18px;
  box-shadow: 5px 6px 0 var(--shadow); padding: 14px 16px 6px; margin-bottom: 16px;
}
.hint {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 12.5px; font-weight: 600; color: var(--faint); padding: 2px 0 10px;
}
.s { position: relative; padding: 11px 30px 11px 0; }
.s + .s { border-top: 1.5px dashed var(--line); }
.s .body { cursor: pointer; font-size: 15.5px; line-height: 1.92; word-break: keep-all; }
.s .ink { box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 0 1px; }
.s.on .ink {
  background: linear-gradient(transparent 50%, var(--marker) 50% 93%, transparent 93%);
}
.s .tail { color: color-mix(in srgb, var(--faint) 70%, transparent); }
.s .pen {
  position: absolute; top: 9px; right: -4px; opacity: .4;
  appearance: none; border: 0; background: none; cursor: pointer;
  color: var(--faint); font-size: 15px; padding: 4px 6px;
}
.s:hover .pen, .s.on .pen { opacity: 1; }

/* ── 밑줄(노트) ───────────────────────────────────────── */
.chips { display: flex; gap: 7px; overflow-x: auto; padding: 2px 2px 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  appearance: none; cursor: pointer; white-space: nowrap; font: inherit;
  font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px;
  border: 2px solid var(--ink); background: var(--card); color: var(--ink);
  box-shadow: 2px 3px 0 var(--shadow);
}
.chip.on { background: var(--ink); color: var(--paper); }
.chip:active { transform: translate(2px, 2px); box-shadow: 0 1px 0 var(--shadow); }

.group-h { font-size: 15px; font-weight: 800; margin: 20px 2px 10px; display: flex; align-items: center; gap: 8px; }
.group-h i { font-style: normal; }

.quote {
  background: var(--card); border: 2px solid var(--ink); border-radius: 16px;
  box-shadow: 4px 5px 0 var(--shadow); padding: 15px 16px; margin-bottom: 13px;
  /* 기울기와 끌림을 한 transform 에 합친다. 따로 쓰면 뒤엣것이 앞엣것을 지운다 —
     비켜서는 카드가 드래그 중에 반듯해지는 꼴을 본다. */
  --rot: 0deg; --dy: 0px;
  transform: translateY(var(--dy)) rotate(var(--rot));
  transition: transform .18s cubic-bezier(.2, .7, .3, 1);
}
.quote:nth-of-type(odd)  { --rot: -.5deg; }
.quote:nth-of-type(even) { --rot: .55deg; }
.quote .q { font-size: 15px; line-height: 1.88; word-break: keep-all; }
.quote .src {
  display: flex; align-items: center; gap: 8px; margin-top: 12px;
  font-size: 12px; font-weight: 700; color: var(--faint);
}
.quote .src .grow { flex: 1; }

/* 끌어 옮기는 손잡이. touch-action:none 이라야 폰에서 스크롤과 다투지 않는다 */
.quote .grip {
  border: 0; background: none;
  /* 글리프는 작아도 잡는 자리는 손가락만 해야 한다.
     안쪽 여백으로 넓히고 바깥 여백으로 되돌려, 줄 높이는 그대로 둔다. */
  padding: 11px 13px 11px 3px; margin: -11px 0 -11px -5px;
  font-size: 16px; line-height: 1; color: var(--faint);
  cursor: grab; touch-action: none;
}
.quote .grip:active { cursor: grabbing; }
/* 들어올린 카드. 손가락을 1:1 로 따라가야 하므로 전환을 끈다 */
.quote.dragging {
  --rot: 0deg; position: relative; z-index: 5; transition: none;
  box-shadow: 10px 12px 0 var(--shadow); opacity: .98;
}

/* ── 빈 화면 · 뼈대 ───────────────────────────────────── */
.empty {
  text-align: center; color: var(--faint); font-weight: 600;
  padding: 70px 22px; line-height: 1.9; white-space: pre-line;
}
.empty b { display: block; font-size: 42px; margin-bottom: 10px; }
.skel {
  background: var(--card); border: 2px solid var(--line); border-radius: 18px;
  padding: 18px 16px; margin-bottom: 14px;
}
.skel i {
  display: block; height: 13px; border-radius: 999px; background: var(--line);
  animation: pulse 1.3s ease-in-out infinite;
}
.skel i + i { margin-top: 10px; width: 58%; }
@keyframes pulse { 50% { opacity: .4; } }

/* ── 하단 탭 ──────────────────────────────────────────── */
nav {
  position: fixed; left: 50%; translate: -50% 0; z-index: 20;
  bottom: calc(14px + var(--safe-b));
  display: flex; gap: 4px; padding: 5px;
  background: var(--card); border: 2px solid var(--ink); border-radius: 999px;
  box-shadow: 4px 5px 0 var(--shadow);
}
nav button {
  appearance: none; border: 0; cursor: pointer; background: none;
  font: inherit; font-size: 13px; font-weight: 700; color: var(--faint);
  padding: 9px 22px; border-radius: 999px;
}
nav button.on { background: var(--ink); color: var(--paper); }

/* ── 시트 ─────────────────────────────────────────────── */
dialog {
  border: 0; padding: 0; background: none; width: 100%; max-width: none;
  margin: 0; margin-top: auto; max-height: 100dvh;
}
dialog::backdrop { background: rgba(36,31,26,.5); }
.sheet {
  background: var(--card); color: var(--ink);
  border: 2px solid var(--ink); border-bottom: 0;
  border-radius: 22px 22px 0 0; padding: 18px 18px calc(18px + var(--safe-b));
  max-width: 660px; margin: 0 auto; animation: up .25s cubic-bezier(.2,.8,.3,1);
}
@keyframes up { from { transform: translateY(24px); } }
.sheet h2 { font-size: 13px; color: var(--faint); font-weight: 700; margin: 0 0 12px; }
.sheet textarea {
  width: 100%; min-height: 132px; resize: vertical; font: inherit; font-size: 15.5px;
  line-height: 1.9; color: var(--ink); background: var(--paper);
  border: 2px solid var(--ink); border-radius: 14px; padding: 13px;
}
.sheet img { width: 100%; max-height: 64dvh; object-fit: contain;
             border: 2px solid var(--ink); border-radius: 14px; background: var(--paper); }
.acts { display: flex; gap: 9px; justify-content: flex-end; margin-top: 14px; }
.acts button {
  appearance: none; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700;
  padding: 10px 20px; border-radius: 12px; border: 2px solid var(--ink);
  background: var(--card); color: var(--ink); box-shadow: 3px 4px 0 var(--shadow);
}
.acts button.primary { background: var(--marker); }
.acts button:active { transform: translate(2px, 2px); box-shadow: 1px 2px 0 var(--shadow); }

/* ── 토스트 ───────────────────────────────────────────── */
#toast {
  position: fixed; left: 50%; translate: -50% 0; z-index: 60;
  bottom: calc(86px + var(--safe-b));
  background: var(--ink); color: var(--paper); font-size: 13.5px; font-weight: 700;
  padding: 10px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
  transition: opacity .18s, translate .18s;
}
#toast.show { opacity: 1; translate: -50% -6px; }
</style>
</head>
<body>

<header>
  <div class="bar">
    <button class="icon" id="back" hidden aria-label="뒤로">←</button>
    <div class="grow">
      <div class="crumb" id="crumb" hidden></div>
      <h1 id="title">밑줄</h1>
    </div>
    <button class="txtbtn" id="photo" hidden>원본</button>
  </div>
</header>

<main id="main"></main>

<nav>
  <button id="tabBooks" class="on">책</button>
  <button id="tabNotes">밑줄</button>
</nav>

<dialog id="editBox">
  <form method="dialog" class="sheet">
    <h2>문장 고치기</h2>
    <textarea id="editText"></textarea>
    <div class="acts">
      <button value="cancel">취소</button>
      <!-- form method=dialog 로 닫으면 close 이벤트가 안 오는 브라우저가 있어
           저장은 submit 이 아니라 버튼 클릭에서 직접 처리한다 -->
      <button type="button" class="primary" id="editSave">저장</button>
    </div>
  </form>
</dialog>

<dialog id="photoBox">
  <form method="dialog" class="sheet">
    <h2 id="photoCap">원본</h2>
    <img id="photoImg" alt="페이지 원본 사진">
    <div class="acts"><button value="close">닫기</button></div>
  </form>
</dialog>

<div id="toast"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
