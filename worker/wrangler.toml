# 밑줄 — Cloudflare Worker
# 공개되어도 되는 값만 여기에 둔다. 토큰은 wrangler secret put 으로 넣는다.

name = "bookmark-note"
main = "src/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "booknote"
database_id = "ea2ee78e-eae9-4aae-bd60-1bbbc55920e0"  # wrangler d1 create 후 실제 id 로 바꾸세요

[vars]
# 텔레그램 챗 ID. 여러 명이면 쉼표로.
ALLOWED_CHATS = "1406724324"
# Apps Script 드라이브 어댑터의 /exec 주소
DRIVE_ADAPTER_URL = "https://script.google.com/macros/s/AKfycbwAxI7pMSEKyaUl9Q79ZmYYKTpDssgSDbYs9exSPWrfkJF8m2WDRwoec_hIl9NesiIN/exec"
# 배포된 Worker 주소 (봇 답장의 앱 링크에 쓴다)
APP_URL = "https://bookmark-note.hong4137.workers.dev"
# 책 페이지 글자 읽기에는 최신 대형 모델이 필요 없다. 가벼운 모델이 무료 한도가 크다.
# 3.6-flash 는 하루 20건이라 금방 막힌다. 2.5 계열은 은퇴해서 404 가 나니 쓰지 않는다.
# 한도가 여전히 모자라면 gemini-3.1-flash-lite, 은퇴로 끊기는 게 싫으면
# gemini-flash-lite-latest. 목록은 봇에 /모델 을 보내면 나온다.
GEMINI_MODEL = "gemini-3.5-flash-lite"
